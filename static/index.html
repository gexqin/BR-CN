<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>■ BATTLE ROYALE ■(V02.00)</title>
<link rel="stylesheet" href="/static/style.css?v=29">
<!-- v 参数:文件更新时同步递增,确保浏览器不混用新旧缓存的 js/css -->
<style>
/* v2 SPA 扩展布局(主题沿用原版 style.css;响应式:窄屏堆叠,宽屏居中版心) */
#app{max-width:880px;margin:0 auto;padding:8px}
.navbar{margin:6px 0;letter-spacing:1px}
.view{display:none}
.view.active{display:block}

/* 主界面:信息面板 + 指令区 双栏,窄屏(<640px)自动上下堆叠 */
.main-layout{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-top:6px}
.main-info{flex:2 1 380px;min-width:0}
.main-info table{width:100%}
.main-cmd{flex:1 1 250px;min-width:0}
#cmdarea label{display:block;margin:3px 0;cursor:pointer}
#cmdarea label:hover{color:#ffff00}

/* 日志区:视口比例高度,窄屏不挤压 */
.log-stream{height:min(280px,36vh);overflow-y:auto;padding:8px;line-height:1.7;
  border:1px solid #fff;margin-top:8px;word-break:break-word}

/* 地图:居中,窄屏缩小格子和字号 */
.map-grid{border-collapse:collapse;margin:0 auto}
.map-grid td,.map-grid th{border:1px solid #666;width:44px;height:34px;text-align:center;font-size:12px;padding:0}
.map-grid td.forbidden{color:#ff0000;font-weight:bold}
.map-grid td.next{color:#ffff00}
.map-grid td.sea{background:#003}

/* 表格面板:占满可用宽度,长内容自动换行 */
table.panel{border:1px solid #fff;border-collapse:collapse;margin:4px 0;width:100%}
table.panel td,table.panel th{border:1px solid #555;padding:3px 8px;word-break:break-word}

/* 管理一览:窄屏横向可滚动 */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-scroll table.panel{width:auto;min-width:100%}

.msg-error{color:#ff4444}
.statbar span{margin-right:10px}
/* 徽章图(原图为居中圆形徽章,不适合平铺):首页整页背景。
   用固定定位背景层实现(不用 body 背景+attachment:fixed——该组合在部分浏览器
   会退化为按文档高度定位,导致拖大窗口后背景卡住/只占上半屏)。
   img + object-fit:contain 保证任意窗口尺寸完整显示、黑边与页面黑底无缝融合。 */
.homebg{background:#000}
/* z-index:不用负值——body 不创建层叠上下文,负 z 层会跑到 body 黑底后面被盖住 */
#bg{position:fixed;inset:0;z-index:0;display:none;
  background:rgba(0,0,0,.55)}    /* 半透明遮罩:压暗背景保证前景可读 */
#bg img{width:100%;height:100%;object-fit:contain;display:block}
body.bg-home #bg{display:block}
#app{position:relative;z-index:1}
/* 首页内容垂直居中(背景为整屏徽章,内容集中顶部会显得失衡) */
body.bg-home #app{min-height:100vh;display:flex;flex-direction:column;
  justify-content:center}
/* 首页文字统一白色(徽章背景为红色系,红字可读性差);错误提示保留红色 */
body.bg-home #app{color:#fff}
body.bg-home #app .red,
body.bg-home #app a:link, body.bg-home #app a:visited, body.bg-home #app a:active{color:#fff}
body.bg-home #app input[type=submit], body.bg-home #app button{color:#fff}
/* 首页错误提示同样用白色(与整页白字统一) */
body.bg-home #app .msg-error{color:#fff}

/* 游戏内模态弹窗(黑底红框,替代原生 confirm/alert) */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center}
.modal-panel{background:#000;border:2px solid #f00;padding:16px 20px;
  max-width:min(420px,88vw);color:#fff;line-height:1.8}

/* 表单与按钮 */
input,select,textarea{background:#000;color:#fff;border:1px solid #888;padding:4px 6px;
  font-size:1em;max-width:100%}
input[type=submit],button{color:#ff0000;font-weight:bold;background:#000;
  border:1px solid #f00;padding:4px 12px;cursor:pointer;border-radius:2px;
  font-size:1em;margin:1px 0}
input[type=submit]:hover,button:hover{background:#200}
form div{margin:4px 0}

/* 窄屏(手机)适配 */
@media (max-width:640px){
  body{padding:8px 4px}
  #app{padding:4px}
  .place-name{font-size:1.4em}
  .title{font-size:1.5em}
  table.panel td,table.panel th{padding:2px 5px}
  .map-grid td,.map-grid th{width:32px;height:26px;font-size:10px}
  .navbar a{margin:0 2px}
}
</style>
</head>
<body class="homebg">
<div id="bg"><img src="/static/img/br_2k.png" alt=""></div>
<div id="app"></div>
<script src="/static/js/api.js?v=29"></script>
<script src="/static/js/ui.js?v=29"></script>
<script src="/static/js/views.js?v=29"></script>
<script src="/static/js/commands.js?v=29"></script>
<script src="/static/js/app.js?v=29"></script>
</body>
</html>
